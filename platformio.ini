
; Default = hardware reale. Wokwi usa esplicitamente env:cyd-wokwi.
[platformio]
default_envs = cyd, cyd-wokwi

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson@^7.0.4
    bitbank2/JPEGDEC@^1.4.2
    https://github.com/bitbank2/PNGdec.git
; TFT_eSPI configurato da qui: non serve toccare User_Setup.h
build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DCORE_DEBUG_LEVEL=0

; CYD standard (1 porta USB micro, driver ILI9341)
[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

; CYD con 2 porte USB (micro + USB-C, driver ST7789)
[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1

[env:cyd-wokwi]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DWOKWI